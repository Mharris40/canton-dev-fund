<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">CompliLedger × Canton Executive Banner</title>
  <desc id="desc">CompliLedger identity on the left and a restrained assurance flow from requirements to verification network on the right.</desc>
  <rect width="1600" height="500" fill="#ffffff"/>

  <line x1="0" y1="80" x2="1600" y2="80" stroke="#d9dce0" stroke-width="1"/>
  <line x1="0" y1="420" x2="1600" y2="420" stroke="#d9dce0" stroke-width="1"/>
  <line x1="540" y1="80" x2="540" y2="420" stroke="#e5e7eb" stroke-width="1"/>

  <text x="90" y="210" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600" fill="#111111">CompliLedger</text>
  <text x="90" y="252" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">AI-Powered Proof Infrastructure</text>
  <text x="90" y="282" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">for Continuous Institutional Assurance</text>
  <text x="90" y="342" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">CompliLedger × Canton</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="610" y="136" width="130" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="675" y="163">Requirements</text>

    <rect x="770" y="136" width="100" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="820" y="163">Evidence</text>

    <rect x="900" y="136" width="164" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="982" y="163">Deterministic Decision</text>

    <rect x="1095" y="136" width="72" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1131" y="163">Proof</text>

    <rect x="1197" y="136" width="162" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1278" y="163">Canton Workflow</text>

    <rect x="1389" y="136" width="140" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1459" y="163">Verification Network</text>
  </g>

  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M742 158H768"/>
    <path d="M872 158H898"/>
    <path d="M1066 158H1093"/>
    <path d="M1169 158H1195"/>
    <path d="M1361 158H1387"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">
    <text x="672" y="226">Applicable controls and context</text>
    <text x="921" y="226">Reproducible, versioned outcomes</text>
    <text x="1211" y="226">Authorized consumption and checks</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
