<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Shared Stakeholder Consumption</title>
  <desc id="desc">A single shared assurance and proof lifecycle serves ProofSync, AuditSync, RegSync, and DevSync through role-authorized access.</desc>
  <rect width="1400" height="860" fill="#ffffff"/>

  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#111111">Shared Stakeholder Consumption</text>
  <text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">One assurance system, differentiated authorized views.</text>

  <rect x="360" y="220" width="680" height="180" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#111111">Shared CompliLedger Assurance Core</text>
  <text x="700" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Decisions · Proof Packages · Verification Outcomes · Lifecycle / Lineage</text>
  <text x="700" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7280">Role and purpose govern what each portal can access</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <rect x="90" y="530" width="290" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="115" y="580" font-size="24" font-weight="600">ProofSync</text>
    <text x="115" y="614" font-size="16" fill="#374151">Client-facing current assurance,</text>
    <text x="115" y="638" font-size="16" fill="#374151">proof lifecycle, and history.</text>

    <rect x="420" y="530" width="290" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="445" y="580" font-size="24" font-weight="600">AuditSync</text>
    <text x="445" y="614" font-size="16" fill="#374151">Authorized assessments,</text>
    <text x="445" y="638" font-size="16" fill="#374151">lineage, and verification.</text>

    <rect x="750" y="530" width="290" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="775" y="580" font-size="24" font-weight="600">RegSync</text>
    <text x="775" y="614" font-size="16" fill="#374151">Governed regulator visibility</text>
    <text x="775" y="638" font-size="16" fill="#374151">within disclosure boundaries.</text>

    <rect x="1080" y="530" width="230" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1105" y="580" font-size="24" font-weight="600">DevSync</text>
    <text x="1105" y="614" font-size="16" fill="#374151">SDK/API, schemas,</text>
    <text x="1105" y="638" font-size="16" fill="#374151">reference integrations.</text>
  </g>

  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="460" y1="402" x2="235" y2="524"/>
    <line x1="620" y1="402" x2="565" y2="524"/>
    <line x1="780" y1="402" x2="895" y2="524"/>
    <line x1="940" y1="402" x2="1188" y2="524"/>
  </g>

  <text x="700" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">These are role-authorized consumption surfaces, not separate reasoning engines.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
